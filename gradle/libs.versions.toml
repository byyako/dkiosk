[versions]
agp = "9.4.1"
appcompat = "1.8.0"
coreKtx = "1.19.1"
junit = "4.13.2"
material = "1.14.0"
orgJson = "20260814"
preference = "1.2.1"
zxing = "3.5.4"

[libraries]
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-preference = { group = "androidx.preference", name = "preference-ktx", version.ref = "preference" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
# QR codes for copying settings to another kiosk. Pure Java, no Google Play services.
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# Android ships org.json, but local unit tests only see stubs of it.
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
